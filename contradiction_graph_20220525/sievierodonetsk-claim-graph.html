    &quot;message&quot;,

        hostPort != null ||

    }

    &quot;codex-visualization-widget-state&quot;,

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

  const connectorGlobals = {};

    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },

    };

      onData(name, callback) {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                } else {

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    { capture: true },

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      });

  });

  syncTheme();

&quot;,&quot;source_claim&quot;:&quot;C5&quot;,&quot;target_claim&quot;:&quot;I4&quot;,&quot;topic&quot;:&quot;lens_defenders_resolve&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;color&quot;:&quot;red&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;Determination to hold the region versus Conditional refusal to defend the city&quot;,&quot;subtype&quot;:&quot;framing_or_lensing_conflict&quot;,&quot;framing_dimension&quot;:&quot;Defenders’ resolve&quot;,&quot;source_lens&quot;:&quot;Determination to hold the region&quot;,&quot;target_lens&quot;:&quot;Conditional refusal to defend the city&quot;,&quot;shared_focus&quot;:&quot;How Ukrainian defenders’ willingness is presented&quot;,&quot;reason&quot;:&quot;Butusov, quoted by Censor.NET, says soldiers will not surrender Luhansk. Izvestia foregrounds a video in which some soldiers refuse to defend Sievierodonetsk without better support. The comparison contrasts resolve and reported breakdown in willingness.&quot;,&quot;caveat&quot;:&quot;The video was published May 19 and concerns an unidentified group. Izvestia also quotes the soldiers saying they are not refusing to defend their homeland in I5. Review the dates, units and conditional wording.&quot;,&quot;direction_reason&quot;:&quot;C5 is proposed to contradict the framing in I4. Direction follows the analyst-assigned comparison order.&quot;,&quot;framing_basis&quot;:&quot;Analyst interpretation of the selected source passages.&quot;},{&quot;id&quot;:&quot;F05&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;izvestia&quot;,&quot;source_claim&quot;:&quot;FT09&quot;,&quot;target_claim&quot;:&quot;I4&quot;,&quot;topic&quot;:&quot;lens_meaning_of_continued_defense&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;color&quot;:&quot;red&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;Buying time for more weapons versus Defense constrained by inadequate support&quot;,&quot;subtype&quot;:&quot;framing_or_lensing_conflict&quot;,&quot;framing_dimension&quot;:&quot;Meaning of continued defense&quot;,&quot;source_lens&quot;:&quot;Buying time for more weapons&quot;,&quot;target_lens&quot;:&quot;Defense constrained by inadequate support&quot;,&quot;shared_focus&quot;:&quot;The strategic meaning of holding the city while awaiting support&quot;,&quot;reason&quot;:&quot;The FT presents continued resistance as buying time for Western weapons. Izvestia presents soldiers’ lack of reinforcements and heavy equipment as grounds for refusal. The lens shifts from purposeful endurance to an unsustainable burden.&quot;,&quot;caveat&quot;:&quot;Both accounts can reflect real equipment shortages, and may describe different troops and dates. This is a proposed contrast in the meaning assigned to continued defense.&quot;,&quot;direction_reason&quot;:&quot;FT09 is proposed to contradict the framing in I4. Direction follows the analyst-assigned comparison order.&quot;,&quot;framing_basis&quot;:&quot;Analyst interpretation of the selected source passages.&quot;},{&quot;id&quot;:&quot;F06&quot;,&quot;source&quot;:&quot;izvestia&quot;,&quot;target&quot;:&quot;censor&quot;,&quot;source_claim&quot;:&quot;I5&quot;,&quot;target_claim&quot;:&quot;C5&quot;,&quot;topic&quot;:&quot;lens_defenders_resolve&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;color&quot;:&quot;green&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;Willingness to defend despite demands for better support supports Determination not to surrender&quot;,&quot;subtype&quot;:&quot;framing_or_lensing_support&quot;,&quot;framing_dimension&quot;:&quot;Defenders’ resolve&quot;,&quot;source_lens&quot;:&quot;Willingness to defend despite demands for better support&quot;,&quot;target_lens&quot;:&quot;Determination not to surrender&quot;,&quot;shared_focus&quot;:&quot;How Ukrainian soldiers’ willingness to continue defending is presented&quot;,&quot;reason&quot;:&quot;The soldiers quoted in Izvestia say they are not refusing to defend their homeland. That statement reinforces the willingness-to-defend part of Butusov’s account in Censor.NET, while adding conditions about support and command.&quot;,&quot;support_scope&quot;:&quot;The limited willingness-to-defend lens, rather than a guarantee that every position will be held.&quot;,&quot;caveat&quot;:&quot;The speakers and units are not established as the same. Defending the homeland is broader than holding every position in Luhansk. This does not establish an unconditional promise to defend Sievierodonetsk or prove that no soldiers withdrew.&quot;,&quot;direction_reason&quot;:&quot;I5 reinforces the named part of C5’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;,&quot;framing_basis&quot;:&quot;Analyst interpretation of the selected source passages.&quot;},{&quot;id&quot;:&quot;F07&quot;,&quot;source&quot;:&quot;izvestia&quot;,&quot;target&quot;:&quot;censor&quot;,&quot;source_claim&quot;:&quot;I5&quot;,&quot;target_claim&quot;:&quot;C6&quot;,&quot;topic&quot;:&quot;lens_support_needed_for_continued_defense&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;color&quot;:&quot;green&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;Soldiers tie continued defense to proper support and command supports Defense requires reinforcement and better decisions&quot;,&quot;subtype&quot;:&quot;framing_or_lensing_support&quot;,&quot;framing_dimension&quot;:&quot;Support needed for continued defense&quot;,&quot;source_lens&quot;:&quot;Soldiers tie continued defense to proper support and command&quot;,&quot;target_lens&quot;:&quot;Defense requires reinforcement and better decisions&quot;,&quot;shared_focus&quot;:&quot;The importance of support and command for continued Ukrainian defense&quot;,&quot;reason&quot;:&quot;The soldiers’ request for proper support and command in Izvestia supplies a concrete example of needs that reinforce Butusov’s support-and-command lens in Censor.NET.&quot;,&quot;support_scope&quot;:&quot;The need to consider support and command when describing continued defense.&quot;,&quot;caveat&quot;:&quot;The quoted soldiers and Butusov are different speakers, and their units and remedies are not established as identical. The soldiers’ request does not prove Butusov’s particular reinforcements or command changes would succeed. Reporting the request does not establish Izvestia’s endorsement.&quot;,&quot;direction_reason&quot;:&quot;I5 reinforces the named part of C6’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;,&quot;framing_basis&quot;:&quot;Analyst interpretation of the selected source passages.&quot;},{&quot;id&quot;:&quot;F08&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;censor&quot;,&quot;source_claim&quot;:&quot;FT11&quot;,&quot;target_claim&quot;:&quot;C6&quot;,&quot;topic&quot;:&quot;lens_support_needed_for_continued_defense&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;color&quot;:&quot;green&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;Military options constrained by shortages of heavy weapons supports Defense requires reinforcement and better decisions&quot;,&quot;subtype&quot;:&quot;framing_or_lensing_support&quot;,&quot;framing_dimension&quot;:&quot;Support needed for continued defense&quot;,&quot;source_lens&quot;:&quot;Military options constrained by shortages of heavy weapons&quot;,&quot;target_lens&quot;:&quot;Defense requires reinforcement and better decisions&quot;,&quot;shared_focus&quot;:&quot;The importance of adequate resources for Ukrainian military action&quot;,&quot;reason&quot;:&quot;The officials’ warning in FT makes equipment shortages central to Ukraine’s military limits. It supplies a reason for the material-support part of Butusov’s call in Censor.NET for reinforcement, reinforcing a resource-dependent defense lens.&quot;,&quot;support_scope&quot;:&quot;The material-support part of C6, rather than its separate judgment about command decisions.&quot;,&quot;caveat&quot;:&quot;FT11 concerns effective counterattacks; C6 concerns the defense around Sievierodonetsk and Lysychansk. Heavy weapons are only part of reinforcement. This cross-task comparison does not establish the success of any particular remedy.&quot;,&quot;direction_reason&quot;:&quot;FT11 reinforces the named part of C6’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;,&quot;framing_basis&quot;:&quot;Analyst interpretation of the selected source passages.&quot;}],&quot;excluded&quot;:[{&quot;outlet&quot;:&quot;CNN&quot;,&quot;reason&quot;:&quot;Cloudflare and SAP leaving Russia: technology and sanctions, not this battle.&quot;},{&quot;outlet&quot;:&quot;European Pravda&quot;,&quot;reason&quot;:&quot;An editorial about territorial concessions, not the specific city offensive.&quot;},{&quot;outlet&quot;:&quot;TASS&quot;,&quot;reason&quot;:&quot;Conditions for peace talks, not this battle.&quot;},{&quot;outlet&quot;:&quot;Sputnik&quot;,&quot;reason&quot;:&quot;A general radio-show outline; no specific city or road claim in the saved text.&quot;},{&quot;outlet&quot;:&quot;China Daily&quot;,&quot;reason&quot;:&quot;Shoigu’s general war aims; no specific Sievierodonetsk or road account.&quot;},{&quot;outlet&quot;:&quot;Global Times&quot;,&quot;reason&quot;:&quot;Hungary’s emergency powers, not this battle.&quot;},{&quot;outlet&quot;:&quot;Kyiv Independent&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;reason&quot;:&quot;No matching framing relation was selected from this article for this network.&quot;}],&quot;method&quot;:{&quot;country_note&quot;:&quot;Outlet country means origin. Source country means stated institutional/location association, not assumed citizenship. Unknown remains unknown.&quot;,&quot;claim_type_note&quot;:&quot;Fact claim means a checkable assertion, not an independently verified fact. Opinions, predictions, intentions and wording are separate.&quot;,&quot;edge_note&quot;:&quot;Green arrows point from a supporting claim to the claim receiving support. Grey comparisons have no assigned direction. Solid red arrows point from a source claim to a target claim it is proposed to contradict. Red direction follows the analyst-assigned comparison order. Every proposed conflict retains its reasoning and scope limits for human review.&quot;,&quot;attention_note&quot;:&quot;Attention is judged from the saved article body and paragraph allocation; it is not an outlet-wide bias score.&quot;,&quot;endorsement_note&quot;:&quot;Quoting a speaker is not endorsement. Outlet view is stated, inferred from wording, or not stated.&quot;,&quot;annotation_status&quot;:&quot;AI-assisted research example; proposed claim relations need human review.&quot;,&quot;excluded_claims&quot;:&quot;Other Donbas locations in the Kyiv brief and Izvestia’s mid-February blame claim are outside the narrow event comparison.&quot;,&quot;support_note&quot;:&quot;Support is an analyst-assigned relation between specific propositions, not political approval, article-to-article endorsement, verified truth, or proof of independent corroboration. An arrow may support only a named part of a compound claim. The reverse arrow is not implied.&quot;,&quot;direction_note&quot;:&quot;Supportive links use source claim → target claim. Logical contradiction is symmetric: if A and B cannot both be true under matching definitions, time and place, the incompatibility holds both ways. A one-way red challenge is appropriate only when a source explicitly denies or rebuts the matching target claim. None is established in this sample; no arbitrary red arrow is added.&quot;,&quot;scope_note&quot;:&quot;One event can contain different places, dates and claim types. Keep the city, wider pocket, two-city area, highway and bridge separate. Operational encirclement or a route under fire can coexist with an incomplete physical ring. An event-wide display does not remove these claim-level limits.&quot;,&quot;multigraph_note&quot;:&quot;Several distinct claim relations may join the same two outlet nodes. Each keeps its own ID, claim endpoints, direction, reason and limits. A link never summarizes the whole outlet.&quot;},&quot;within_article_relations&quot;:[]}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;
      const root = document.getElementById(&quot;dnipro-event-graph&quot;);
      if (!root) return;
      const find = (id) =&gt; root.querySelector(&quot;#&quot; + id);
      const detail = find(&quot;dnipro-claim-detail&quot;);
      const detailPane = find(&quot;dnipro-detail-pane&quot;);
      let data;
      try {
        data = JSON.parse(find(&quot;dnipro-claim-data&quot;).textContent);
      } catch (error) {
        const alert = document.createElement(&quot;p&quot;);
        alert.setAttribute(&quot;role&quot;, &quot;alert&quot;);
        alert.textContent = &quot;The article data could not be loaded.&quot;;
        detail.replaceChildren(alert);
        return;
      }
      const nodes = Array.isArray(data.nodes) ? data.nodes : [];
      const topics = Array.isArray(data.topics) ? data.topics : [];
      const edges = Array.isArray(data.edges) ? data.edges : [];
      const nodeById = new Map(nodes.map((node) =&gt; [node.id, node]));
      const edgeById = new Map(edges.map(edge =&gt; [edge.id, edge]));
      const groupsByKey = new Map();
      const groupByEdgeId = new Map();
      activeEdges().forEach(edge =&gt; {
        const pair = [edge.source, edge.target];
        if (!edge.directed) pair.sort();
        const key = JSON.stringify([edge.relation, Boolean(edge.directed), ...pair]);
        if (!groupsByKey.has(key)) groupsByKey.set(key, { ...edge, members: [] });
        const group = groupsByKey.get(key);
        group.members.push(edge);
        groupByEdgeId.set(edge.id, group);
      });
      const edgeGroups = [...groupsByKey.values()];
      const topicById = new Map(topics.map((topic) =&gt; [topic.id, topic]));
      const claimById = new Map();
      nodes.forEach((node) =&gt; (node.claims || []).forEach((claim) =&gt; claimById.set(claim.id, claim)));
      const stage = find(&quot;dnipro-graph-stage&quot;);
      const svg = find(&quot;dnipro-graph-lines&quot;);
      const nodeLayer = find(&quot;dnipro-graph-nodes&quot;);
      const comparisons = find(&quot;dnipro-comparison-list&quot;);
      const status = find(&quot;dnipro-selection-status&quot;);
      const nodeElements = new Map();
      const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
      const defaultNode = nodeById.has(data.event.default_node) ? data.event.default_node : nodes[0]?.id;
      let state = { selection: { kind: &quot;node&quot;, id: defaultNode } };

      function text(value, fallback = &quot;Not stated&quot;) {
        if (value === null || value === undefined || value === &quot;&quot;) return fallback;
        return typeof value === &quot;string&quot; ? value : String(value);
      }
      function el(tag, content, className) {
        const element = document.createElement(tag);
        if (content !== undefined &amp;&amp; content !== null) element.textContent = content;
        if (className) element.className = className;
        return element;
      }
      function relationName(edge) {
        if (edge.relation === &quot;supportive&quot;) return &quot;Supportive&quot;;
        if (edge.relation === &quot;agreement&quot;) return &quot;Agreement&quot;;
        if (edge.relation === &quot;contradiction&quot;) return &quot;Proposed contradiction&quot;;
        return &quot;Neutral / unresolved&quot;;
      }
      function pairName(edge) {
        return text(nodeById.get(edge.source)?.label, edge.source) + (edge.directed ? &quot; → &quot; : &quot; ↔ &quot;) + text(nodeById.get(edge.target)?.label, edge.target);
      }
      function activeEdges() {
        return edges.filter((edge) =&gt; nodeById.has(edge.source) &amp;&amp; nodeById.has(edge.target));
      }
      function readSaved(raw) {
        if (!raw || typeof raw !== &quot;object&quot;) return null;
        const saved = raw.privateContent || raw;
        const candidate = saved.dniproEventGraph || saved.dniproDatedGraph || saved.dniproReferendumGraph;
        if (!candidate || ![1, 2].includes(candidate.version)) return null;
        if (candidate.event_id &amp;&amp; candidate.event_id !== data.event.id) return null;
        return candidate;
      }
      function normalize(candidate) {
        const next = { selection: { ...state.selection } };
        if (candidate?.selection?.kind === &quot;node&quot; &amp;&amp; nodeById.has(candidate.selection.id)) {
          next.selection = { kind: &quot;node&quot;, id: candidate.selection.id };
        } else if (candidate?.selection?.kind === &quot;edge&quot;) {
          const edge = edgeById.get(candidate.selection.id);
          if (edge) next.selection = { kind: &quot;edge&quot;, id: edge.id };
        }
        if (next.selection.kind === &quot;edge&quot;) {
          const edge = edgeById.get(next.selection.id);
          if (!edge) next.selection = { kind: &quot;node&quot;, id: defaultNode };
        }
        return next;
      }
      function saveState() {
        const host = window.openai;
        if (!host || typeof host.setWidgetState !== &quot;function&quot;) return;
        const selection = state.selection;
        const selectedNode = selection.kind === &quot;node&quot; ? nodeById.get(selection.id) : null;
        const selectedEdge = selection.kind === &quot;edge&quot; ? edgeById.get(selection.id) : null;
        const snapshot = {
          modelContent: {
            event: text(data.event?.label),
            date: text(data.event?.date),
            graph_scope: &quot;whole_event&quot;,
            selected_outlet: selectedNode ? text(selectedNode.label) : null,
            selected_comparison: selectedEdge ? { id: selectedEdge.id, outlets: pairName(selectedEdge), relation: selectedEdge.relation, source_claim: selectedEdge.source_claim, target_claim: selectedEdge.target_claim } : null
          },
          privateContent: { dniproEventGraph: { version: 2, event_id: data.event?.id, selection: { ...selection } } }
        };
        try { Promise.resolve(host.setWidgetState(snapshot)).catch(() =&gt; {}); } catch (error) { /* Optional host state must not interrupt reading. */ }
      }
      function selectNode(id) {
        if (!nodeById.has(id)) return;
        state.selection = { kind: &quot;node&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function selectEdge(id) {
        const edge = edgeById.get(id);
        if (!edge) return;
        state.selection = { kind: &quot;edge&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function addLine(parent, label, value) {
        if (value === null || value === undefined || value === &quot;&quot;) return;
        const p = el(&quot;p&quot;, null, &quot;detail-line&quot;);
        p.append(el(&quot;span&quot;, label + &quot;: &quot;, &quot;detail-label&quot;), document.createTextNode(text(value)));
        parent.append(p);
      }
      function articleLink(node) {
        const article = node.article || {};
        let url;
        try { url = new URL(article.url); } catch (error) { return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;); }
        if (![&quot;https:&quot;, &quot;http:&quot;].includes(url.protocol)) return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;);
        const p = el(&quot;p&quot;, null, &quot;detail-link&quot;);
        const link = el(&quot;a&quot;, text(article.title, &quot;Read article&quot;));
        link.href = url.href;
        link.target = &quot;_blank&quot;;
        link.rel = &quot;noopener noreferrer&quot;;
        p.append(link);
        return p;
      }
      function claimSection(claim, node) {
        const section = el(&quot;details&quot;, null, &quot;claim-section&quot;);
        const summary = el(&quot;summary&quot;, claim.id + &quot; · &quot; + (claim.context_only ? &quot;Background · &quot; : &quot;&quot;) + text(claim.text, &quot;Claim&quot;), &quot;cursor-interaction&quot;);
        section.dataset.claimId = claim.id;
        const content = el(&quot;div&quot;, null, &quot;claim-section-content&quot;);
        const fields = el(&quot;dl&quot;, null, &quot;claim-fields&quot;);
        function field(label, value) {
          fields.append(el(&quot;dt&quot;, label));
          const dd = el(&quot;dd&quot;);
          if (value &amp;&amp; value.nodeType) dd.append(value);
          else dd.textContent = text(value);
          fields.append(dd);
        }
        const kind = claim.kind || {};
        field(&quot;Fact or opinion?&quot;, text(kind.label) + (kind.status ? &quot; · &quot; + text(kind.status) : &quot;&quot;));
        const people = el(&quot;ul&quot;);
        const claimants = Array.isArray(claim.claimants) ? claim.claimants : [];
        if (!claimants.length) people.append(el(&quot;li&quot;, &quot;Not stated&quot;));
        claimants.forEach((person) =&gt; {
          const li = el(&quot;li&quot;, text(person.name) + (person.role ? &quot; — &quot; + text(person.role) : &quot;&quot;) + &quot;; &quot; + text(person.country, &quot;Country not stated&quot;));
          if (person.country_basis) li.append(el(&quot;div&quot;, text(person.country_basis), &quot;text-small&quot;));
          people.append(li);
        });
        field(&quot;Who makes the claim?&quot;, people);
        const stance = claim.stance || {};
        const stanceText = el(&quot;div&quot;, text(stance.label) + (stance.target ? &quot; — &quot; + text(stance.target) : &quot;&quot;));
        if (stance.note) stanceText.append(el(&quot;p&quot;, text(stance.note), &quot;detail-line&quot;));
        field(&quot;Supports or criticizes?&quot;, stanceText);
        field(&quot;What gets attention?&quot;, claim.attention || node.attention);
        field(&quot;Outlet’s own view&quot;, claim.outlet_view);
        content.append(fields);
        addLine(content, &quot;Aspect of event&quot;, (claim.topics || []).map(id =&gt; text(topicById.get(id)?.label, id)).join(&quot;; &quot;));
        addLine(content, &quot;Time / place&quot;, claim.where_when);
        addLine(content, &quot;Limits of this claim&quot;, claim.uncertainty);
        const evidence = claim.evidence || {};
        if (evidence.quote) {
          const paragraphNumbers = Array.isArray(evidence.paragraphs) ? evidence.paragraphs : [];
          const label = &quot;Evidence&quot; + (paragraphNumbers.length ? &quot; · paragraph&quot; + (paragraphNumbers.length &gt; 1 ? &quot;s &quot; : &quot; &quot;) + paragraphNumbers.join(&quot;, &quot;) : &quot;&quot;) + (evidence.language ? &quot; · &quot; + evidence.language : &quot;&quot;);
          content.append(el(&quot;p&quot;, label, &quot;detail-label&quot;), el(&quot;blockquote&quot;, text(evidence.quote), &quot;quote&quot;));
        }
        if (evidence.supporting_sentence) {
          const fullEvidence = el(&quot;details&quot;, null, &quot;method-details&quot;);
          fullEvidence.append(el(&quot;summary&quot;, &quot;Full supporting sentence&quot;, &quot;cursor-interaction&quot;), el(&quot;blockquote&quot;, text(evidence.supporting_sentence), &quot;quote&quot;));
          if (evidence.english_translation) addLine(fullEvidence, &quot;English translation&quot;, evidence.english_translation);

  const controls = document.getElementById("network-switch");
  const frames = [...document.querySelectorAll("iframe[data-network-view]")];
  const updateHeight = () => {
    document.documentElement.style.setProperty("--network-switch-height", controls.getBoundingClientRect().height + "px");
  };
  controls.addEventListener("change", (event) => {
    if (event.target.name !== "dnipro-network-view") return;
    frames.forEach((frame) => {
      frame.hidden = frame.dataset.networkView !== event.target.value;
      if (!frame.hidden) {
        frame.contentWindow?.postMessage({ type: "dnipro-network-activate" }, "*");
      }
    });
  });
  updateHeight();
  if (typeof ResizeObserver === "function") new ResizeObserver(updateHeight).observe(controls);
  else window.addEventListener("resize", updateHeight);
})();
