        hostPort != null ||

label&quot;:&quot;Occupation versus Liberation&quot;,&quot;source_lens&quot;:&quot;Occupation&quot;,&quot;target_lens&quot;:&quot;Liberation&quot;,&quot;shared_focus&quot;:&quot;The description of Russian-held Zaporizhzhia&quot;,&quot;reason&quot;:&quot;Global Times uses Russia-occupied for Kherson and Zaporizhzhia. Izvestia uses liberated for Zaporizhzhia. The frame changes Russian control from occupation to liberation.&quot;,&quot;caveat&quot;:&quot;The overlap is Zaporizhzhia. Other passages quoted in Global Times can carry different views, so this comparison stays with the narrators’ own wording.&quot;,&quot;direction_reason&quot;:&quot;GT07 is proposed to contradict the framing in I07. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F03&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;izvestia&quot;,&quot;source_claim&quot;:&quot;FT02&quot;,&quot;target_claim&quot;:&quot;I05&quot;,&quot;framing_dimension_id&quot;:&quot;lens_voter_agency&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;label&quot;:&quot;Restricted choice under repression versus Genuine self-determination&quot;,&quot;source_lens&quot;:&quot;Restricted choice under repression&quot;,&quot;target_lens&quot;:&quot;Genuine self-determination&quot;,&quot;shared_focus&quot;:&quot;Whether the voting expresses residents’ own wishes&quot;,&quot;reason&quot;:&quot;The FT narrator presents the vote through occupation and repression. Putin, quoted by Izvestia, presents Russia as responding to residents’ sincere wish to decide their own lives. The passages assign contrasting agency to residents.&quot;,&quot;caveat&quot;:&quot;The FT qualifies its assessment as applying to many residents. Putin’s broad account of residents’ wishes is a quoted justification. Human review must align their populations and scope.&quot;,&quot;direction_reason&quot;:&quot;FT02 is proposed to contradict the framing in I05. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F04&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;ft&quot;,&quot;source_claim&quot;:&quot;CNN02&quot;,&quot;target_claim&quot;:&quot;FT05&quot;,&quot;framing_dimension_id&quot;:&quot;lens_role_of_armed_escorts&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;label&quot;:&quot;Intimidation and coercion versus Protection and security&quot;,&quot;source_lens&quot;:&quot;Intimidation and coercion&quot;,&quot;target_lens&quot;:&quot;Protection and security&quot;,&quot;shared_focus&quot;:&quot;Armed or police-accompanied door-to-door voting&quot;,&quot;reason&quot;:&quot;The Ukrainian adviser quoted by CNN describes armed home visits as coercion at gunpoint. The Russia-appointed official quoted by the FT describes police-accompanied visits as protection. The security presence is given opposing meanings.&quot;,&quot;caveat&quot;:&quot;The CNN allegation concerns Mariupol and was not independently verified. The FT official discusses Zaporizhzhia. This compares the lens on similar practices across places, rather than asserting the same team or incident.&quot;,&quot;direction_reason&quot;:&quot;CNN02 is proposed to contradict the framing in FT05. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F05&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;tass&quot;,&quot;source_claim&quot;:&quot;FT09&quot;,&quot;target_claim&quot;:&quot;T03&quot;,&quot;framing_dimension_id&quot;:&quot;lens_procedural_legitimacy&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;label&quot;:&quot;Below democratic standards versus Open and transparent preparation&quot;,&quot;source_lens&quot;:&quot;Below democratic standards&quot;,&quot;target_lens&quot;:&quot;Open and transparent preparation&quot;,&quot;shared_focus&quot;:&quot;The quality and legitimacy of the voting arrangements&quot;,&quot;reason&quot;:&quot;The FT narrator judges the methods against democratic standards and finds them deficient. Matviyenko, quoted by TASS, praises organization, transparency and openness. They select different standards to evaluate the voting exercise.&quot;,&quot;caveat&quot;:&quot;Administrative preparation and democratic fairness can differ. Matviyenko partly relays colleagues’ views. The proposed conflict concerns the evaluative lens.&quot;,&quot;direction_reason&quot;:&quot;FT09 is proposed to contradict the framing in T03. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F06&quot;,&quot;source&quot;:&quot;censor&quot;,&quot;target&quot;:&quot;ft&quot;,&quot;source_claim&quot;:&quot;CEN05&quot;,&quot;target_claim&quot;:&quot;FT01&quot;,&quot;framing_dimension_id&quot;:&quot;lens_who_drives_the_event&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;label&quot;:&quot;An imposed exercise run by occupiers and puppets versus A historic act of residents’ free will&quot;,&quot;source_lens&quot;:&quot;An imposed exercise run by occupiers and puppets&quot;,&quot;target_lens&quot;:&quot;A historic act of residents’ free will&quot;,&quot;shared_focus&quot;:&quot;The agency and legitimacy assigned to the vote&quot;,&quot;reason&quot;:&quot;Censor.NET’s narrator uses occupiers, puppets and so-called referendum. Saulenko, quoted by the FT, describes a historic expression of free will and a bright future. The descriptions center imposed control and voluntary choice respectively.&quot;,&quot;caveat&quot;:&quot;Censor.NET’s lead names Donetsk, Luhansk and Melitopol. Saulenko speaks from Berdyansk. His praise is separate from the FT’s own assessment and concerns a different local setting.&quot;,&quot;direction_reason&quot;:&quot;CEN05 is proposed to contradict the framing in FT01. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F07&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;target&quot;:&quot;izvestia&quot;,&quot;source_claim&quot;:&quot;KI02&quot;,&quot;target_claim&quot;:&quot;I05&quot;,&quot;framing_dimension_id&quot;:&quot;lens_basis_of_the_claimed_mandate&quot;,&quot;relation&quot;:&quot;contradiction&quot;,&quot;label&quot;:&quot;Manufactured outcomes versus Authentic popular will&quot;,&quot;source_lens&quot;:&quot;Manufactured outcomes&quot;,&quot;target_lens&quot;:&quot;Authentic popular will&quot;,&quot;shared_focus&quot;:&quot;Whether the vote can supply a genuine popular mandate&quot;,&quot;reason&quot;:&quot;Jean-Pierre, quoted by Kyiv Independent, pre-labels Russia’s announced outcomes fabricated. Putin, quoted by Izvestia, justifies the vote as a response to residents’ sincere wishes. The framing shifts the source of legitimacy from manufactured results to popular agency.&quot;,&quot;caveat&quot;:&quot;A predicted result and a claim about residents’ wishes are different propositions. This is a proposed legitimacy-frame conflict, requiring review of whose wishes and which results are meant.&quot;,&quot;direction_reason&quot;:&quot;KI02 is proposed to contradict the framing in I05. The arrow follows the analyst-assigned comparison order.&quot;},{&quot;id&quot;:&quot;F08&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;ft&quot;,&quot;source_claim&quot;:&quot;CNN02&quot;,&quot;target_claim&quot;:&quot;FT02&quot;,&quot;framing_dimension_id&quot;:&quot;lens_voter_agency&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;Armed pressure limits residents’ choice supports Voting under occupation is far from free choice&quot;,&quot;source_lens&quot;:&quot;Armed pressure limits residents’ choice&quot;,&quot;target_lens&quot;:&quot;Voting under occupation is far from free choice&quot;,&quot;shared_focus&quot;:&quot;Whether residents can freely choose during the September 23–27 votes&quot;,&quot;reason&quot;:&quot;The Ukrainian mayoral adviser’s account in CNN places armed men alongside door-to-door voting teams and describes coercion. That allegation gives a concrete reason for the restricted-choice lens expressed by the FT narrator.&quot;,&quot;support_scope&quot;:&quot;The framing of constrained voter agency in the reported setting.&quot;,&quot;caveat&quot;:&quot;CNN could not independently verify the adviser’s account, and the adviser was outside Mariupol. This does not establish coercion throughout all four regions or make CNN the author of the allegation.&quot;,&quot;direction_reason&quot;:&quot;CNN02 reinforces the named part of FT02’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F09&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;kyivpost&quot;,&quot;source_claim&quot;:&quot;FT04&quot;,&quot;target_claim&quot;:&quot;KI02&quot;,&quot;framing_dimension_id&quot;:&quot;lens_authenticity_of_the_result&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;An individual voter expects to have no meaningful influence supports Announced outcomes will be manufactured&quot;,&quot;source_lens&quot;:&quot;An individual voter expects to have no meaningful influence&quot;,&quot;target_lens&quot;:&quot;Announced outcomes will be manufactured&quot;,&quot;shared_focus&quot;:&quot;Whether the announced results will meaningfully depend on residents’ participation and choices&quot;,&quot;reason&quot;:&quot;The Donetsk businessman’s expectation that a vote will be counted even if he does not participate presents the result as detached from his agency. That account reinforces the manufactured-outcome lens in Jean-Pierre’s statement reported by Kyiv Independent.&quot;,&quot;support_scope&quot;:&quot;The interpretation of outcomes as detached from individual voter agency.&quot;,&quot;caveat&quot;:&quot;An unnamed individual’s expectation in Donetsk is not proof of how votes were counted, and cannot verify Jean-Pierre’s broader prediction about every announced outcome. These are attributed views, not endorsements by both outlets.&quot;,&quot;direction_reason&quot;:&quot;FT04 reinforces the named part of KI02’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F10&quot;,&quot;source&quot;:&quot;izvestia&quot;,&quot;target&quot;:&quot;tass&quot;,&quot;source_claim&quot;:&quot;I08&quot;,&quot;target_claim&quot;:&quot;T03&quot;,&quot;framing_dimension_id&quot;:&quot;lens_procedural_legitimacy&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;Observation is foregrounded as part of the voting process supports Preparation is presented as open and transparent&quot;,&quot;source_lens&quot;:&quot;Observation is foregrounded as part of the voting process&quot;,&quot;target_lens&quot;:&quot;Preparation is presented as open and transparent&quot;,&quot;shared_focus&quot;:&quot;The use of observers to present the votes as an orderly and scrutinized process&quot;,&quot;reason&quot;:&quot;Izvestia’s planned-observer account foregrounds observation of the voting. This supplies one procedural feature consistent with Matviyenko’s openness-and-transparency presentation in TASS.&quot;,&quot;support_scope&quot;:&quot;The observation-related part of the procedural presentation, not the entire transparency assessment.&quot;,&quot;caveat&quot;:&quot;The presence or planned presence of observers does not establish their independence, meaningful access, lawful voting, or freedom from coercion. Similar official information may underlie both passages; this is support for a procedural presentation, not independent corroboration of transparency.&quot;,&quot;direction_reason&quot;:&quot;I08 reinforces the named part of T03’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F11&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;global_times&quot;,&quot;source_claim&quot;:&quot;CNN07&quot;,&quot;target_claim&quot;:&quot;GT04&quot;,&quot;framing_dimension_id&quot;:&quot;lens_escalation_stakes&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;Claimed incorporation would redefine Ukrainian attacks as attacks on Russia supports Claimed incorporation could raise Russia’s response stakes&quot;,&quot;source_lens&quot;:&quot;Claimed incorporation would redefine Ukrainian attacks as attacks on Russia&quot;,&quot;target_lens&quot;:&quot;Claimed incorporation could raise Russia’s response stakes&quot;,&quot;shared_focus&quot;:&quot;How the proposed incorporation could change Russia’s treatment of later Ukrainian attacks&quot;,&quot;reason&quot;:&quot;Peskov’s statement in CNN supplies the territorial reclassification behind the escalation lens: Russia would regard Ukrainian efforts to retake the regions as attacks on Russian territory. That stated position gives a reason for the Global Times expert’s forecast of a wider range of possible Russian responses.&quot;,&quot;support_scope&quot;:&quot;The escalation mechanism in the conditional forecast, rather than every predicted Russian response.&quot;,&quot;caveat&quot;:&quot;Both statements concern a conditional future after claimed incorporation. Peskov’s classification does not establish legal sovereignty, justify a response, or confirm the expert’s prediction that Russia might use every possible military and political means. Neither quotation establishes an outlet endorsement.&quot;,&quot;direction_reason&quot;:&quot;CNN07 reinforces the named part of GT04’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;}],&quot;framing_topics&quot;:[{&quot;framing_dimension_id&quot;:&quot;lens_voter_agency&quot;,&quot;framing_dimension_label&quot;:&quot;Voter agency&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_authenticity_of_the_result&quot;,&quot;framing_dimension_label&quot;:&quot;Authenticity of the result&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_procedural_legitimacy&quot;,&quot;framing_dimension_label&quot;:&quot;Procedural legitimacy&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_escalation_stakes&quot;,&quot;framing_dimension_label&quot;:&quot;Escalation stakes&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_territorial_status&quot;,&quot;framing_dimension_label&quot;:&quot;Territorial status&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_role_of_armed_escorts&quot;,&quot;framing_dimension_label&quot;:&quot;Role of armed escorts&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_who_drives_the_event&quot;,&quot;framing_dimension_label&quot;:&quot;Who drives the event&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_basis_of_the_claimed_mandate&quot;,&quot;framing_dimension_label&quot;:&quot;Basis of the claimed mandate&quot;}]}}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;
      const root = document.getElementById(&quot;dnipro-event-graph&quot;);
      if (!root) return;
      const find = (id) =&gt; root.querySelector(&quot;#&quot; + id);
      const detail = find(&quot;dnipro-claim-detail&quot;);
      const detailPane = find(&quot;dnipro-detail-pane&quot;);
      let data;
      try {
        data = JSON.parse(find(&quot;dnipro-claim-data&quot;).textContent);
      } catch (error) {
        const alert = document.createElement(&quot;p&quot;);
        alert.setAttribute(&quot;role&quot;, &quot;alert&quot;);
        alert.textContent = &quot;The article data could not be loaded.&quot;;
        detail.replaceChildren(alert);
        return;
      }
      const nodes = Array.isArray(data.nodes) ? data.nodes : [];
      const topics = Array.isArray(data.topics) ? data.topics : [];
      const edges = Array.isArray(data.edges) ? data.edges : [];
      const nodeById = new Map(nodes.map((node) =&gt; [node.id, node]));
      const edgeById = new Map(edges.map(edge =&gt; [edge.id, edge]));
      const groupsByKey = new Map();
      const groupByEdgeId = new Map();
      activeEdges().forEach(edge =&gt; {
        const pair = [edge.source, edge.target];
        if (!edge.directed) pair.sort();
        const key = JSON.stringify([edge.relation, Boolean(edge.directed), ...pair]);
        if (!groupsByKey.has(key)) groupsByKey.set(key, { ...edge, members: [] });
        const group = groupsByKey.get(key);
        group.members.push(edge);
        groupByEdgeId.set(edge.id, group);
      });
      const edgeGroups = [...groupsByKey.values()];
      const topicById = new Map(topics.map((topic) =&gt; [topic.id, topic]));
      const claimById = new Map();
      nodes.forEach((node) =&gt; (node.claims || []).forEach((claim) =&gt; claimById.set(claim.id, claim)));
      const stage = find(&quot;dnipro-graph-stage&quot;);
      const svg = find(&quot;dnipro-graph-lines&quot;);
      const nodeLayer = find(&quot;dnipro-graph-nodes&quot;);
      const comparisons = find(&quot;dnipro-comparison-list&quot;);
      const status = find(&quot;dnipro-selection-status&quot;);
      const nodeElements = new Map();
      const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
      const defaultNode = nodeById.has(data.event.default_node) ? data.event.default_node : nodes[0]?.id;
      let state = { selection: { kind: &quot;node&quot;, id: defaultNode } };

      function text(value, fallback = &quot;Not stated&quot;) {
        if (value === null || value === undefined || value === &quot;&quot;) return fallback;
        return typeof value === &quot;string&quot; ? value : String(value);
      }
      function el(tag, content, className) {
        const element = document.createElement(tag);
        if (content !== undefined &amp;&amp; content !== null) element.textContent = content;
        if (className) element.className = className;
        return element;
      }
      function relationName(edge) {
        if (edge.relation === &quot;supportive&quot;) return &quot;Supportive&quot;;
        if (edge.relation === &quot;agreement&quot;) return &quot;Agreement&quot;;
        if (edge.relation === &quot;contradiction&quot;) return &quot;Proposed contradiction&quot;;
        return &quot;Neutral / unresolved&quot;;
      }
      function pairName(edge) {
        return text(nodeById.get(edge.source)?.label, edge.source) + (edge.directed ? &quot; → &quot; : &quot; ↔ &quot;) + text(nodeById.get(edge.target)?.label, edge.target);
      }
      function activeEdges() {
        return edges.filter((edge) =&gt; nodeById.has(edge.source) &amp;&amp; nodeById.has(edge.target));
      }
      function readSaved(raw) {
        if (!raw || typeof raw !== &quot;object&quot;) return null;
        const saved = raw.privateContent || raw;
        const candidate = saved.dniproEventGraph || saved.dniproDatedGraph || saved.dniproReferendumGraph;
        if (!candidate || ![1, 2].includes(candidate.version)) return null;
        if (candidate.event_id &amp;&amp; candidate.event_id !== data.event.id) return null;
        return candidate;
      }
      function normalize(candidate) {
        const next = { selection: { ...state.selection } };
        if (candidate?.selection?.kind === &quot;node&quot; &amp;&amp; nodeById.has(candidate.selection.id)) {
          next.selection = { kind: &quot;node&quot;, id: candidate.selection.id };
        } else if (candidate?.selection?.kind === &quot;edge&quot;) {
          const edge = edgeById.get(candidate.selection.id);
          if (edge) next.selection = { kind: &quot;edge&quot;, id: edge.id };
        }
        if (next.selection.kind === &quot;edge&quot;) {
          const edge = edgeById.get(next.selection.id);
          if (!edge) next.selection = { kind: &quot;node&quot;, id: defaultNode };
        }
        return next;
      }
      function saveState() {
        const host = window.openai;
        if (!host || typeof host.setWidgetState !== &quot;function&quot;) return;
        const selection = state.selection;
        const selectedNode = selection.kind === &quot;node&quot; ? nodeById.get(selection.id) : null;
        const selectedEdge = selection.kind === &quot;edge&quot; ? edgeById.get(selection.id) : null;
        const snapshot = {
          modelContent: {
            event: text(data.event?.label),
            date: text(data.event?.date),
            graph_scope: &quot;whole_event&quot;,
            selected_outlet: selectedNode ? text(selectedNode.label) : null,
            selected_comparison: selectedEdge ? { id: selectedEdge.id, outlets: pairName(selectedEdge), relation: selectedEdge.relation, source_claim: selectedEdge.source_claim, target_claim: selectedEdge.target_claim } : null
          },
          privateContent: { dniproEventGraph: { version: 2, event_id: data.event?.id, selection: { ...selection } } }
        };
        try { Promise.resolve(host.setWidgetState(snapshot)).catch(() =&gt; {}); } catch (error) { /* Optional host state must not interrupt reading. */ }
      }
      function selectNode(id) {
        if (!nodeById.has(id)) return;
        state.selection = { kind: &quot;node&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function selectEdge(id) {
        const edge = edgeById.get(id);
        if (!edge) return;
        state.selection = { kind: &quot;edge&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function addLine(parent, label, value) {
        if (value === null || value === undefined || value === &quot;&quot;) return;
        const p = el(&quot;p&quot;, null, &quot;detail-line&quot;);
        p.append(el(&quot;span&quot;, label + &quot;: &quot;, &quot;detail-label&quot;), document.createTextNode(text(value)));
        parent.append(p);
      }
      function articleLink(node) {
        const article = node.article || {};
        let url;
        try { url = new URL(article.url); } catch (error) { return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;); }
        if (![&quot;https:&quot;, &quot;http:&quot;].includes(url.protocol)) return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;);
        const p = el(&quot;p&quot;, null, &quot;detail-link&quot;);
        const link = el(&quot;a&quot;, text(article.title, &quot;Read article&quot;));
        link.href = url.href;
        link.target = &quot;_blank&quot;;
        link.rel = &quot;noopener noreferrer&quot;;
        p.append(link);
        return p;
      }
      function claimSection(claim, node) {
        const section = el(&quot;details&quot;, null, &quot;claim-section&quot;);
        const summary = el(&quot;summary&quot;, claim.id + &quot; · &quot; + (claim.context_only ? &quot;Background · &quot; : &quot;&quot;) + text(claim.text, &quot;Claim&quot;), &quot;cursor-interaction&quot;);
        section.dataset.claimId = claim.id;
        const content = el(&quot;div&quot;, null, &quot;claim-section-content&quot;);
        const fields = el(&quot;dl&quot;, null, &quot;claim-fields&quot;);
        function field(label, value) {
          fields.append(el(&quot;dt&quot;, label));
          const dd = el(&quot;dd&quot;);
          if (value &amp;&amp; value.nodeType) dd.append(value);
          else dd.textContent = text(value);
          fields.append(dd);
        }
        const kind = claim.kind || {};
        field(&quot;Fact or opinion?&quot;, text(kind.label) + (kind.status ? &quot; · &quot; + text(kind.status) : &quot;&quot;));
        const people = el(&quot;ul&quot;);
        const claimants = Array.isArray(claim.claimants) ? claim.claimants : [];
        if (!claimants.length) people.append(el(&quot;li&quot;, &quot;Not stated&quot;));
        claimants.forEach((person) =&gt; {
          const li = el(&quot;li&quot;, text(person.name) + (person.role ? &quot; — &quot; + text(person.role) : &quot;&quot;) + &quot;; &quot; + text(person.country, &quot;Country not stated&quot;));
          if (person.country_basis) li.append(el(&quot;div&quot;, text(person.country_basis), &quot;text-small&quot;));
          people.append(li);
        });
        field(&quot;Who makes the claim?&quot;, people);
        const stance = claim.stance || {};
        const stanceText = el(&quot;div&quot;, text(stance.label) + (stance.target ? &quot; — &quot; + text(stance.target) : &quot;&quot;));
        if (stance.note) stanceText.append(el(&quot;p&quot;, text(stance.note), &quot;detail-line&quot;));
        field(&quot;Supports or criticizes?&quot;, stanceText);
        field(&quot;What gets attention?&quot;, claim.attention || node.attention);
        field(&quot;Outlet’s own view&quot;, claim.outlet_view);
        content.append(fields);
        addLine(content, &quot;Aspect of event&quot;, (claim.topics || []).map(id =&gt; text(topicById.get(id)?.label, id)).join(&quot;; &quot;));
        addLine(content, &quot;Time / place&quot;, claim.where_when);
        addLine(content, &quot;Limits of this claim&quot;, claim.uncertainty);
        const evidence = claim.evidence || {};
        if (evidence.quote) {
          const paragraphNumbers = Array.isArray(evidence.paragraphs) ? evidence.paragraphs : [];
          const label = &quot;Evidence&quot; + (paragraphNumbers.length ? &quot; · paragraph&quot; + (paragraphNumbers.length &gt; 1 ? &quot;s &quot; : &quot; &quot;) + paragraphNumbers.join(&quot;, &quot;) : &quot;&quot;) + (evidence.language ? &quot; · &quot; + evidence.language : &quot;&quot;);
          content.append(el(&quot;p&quot;, label, &quot;detail-label&quot;), el(&quot;blockquote&quot;, text(evidence.quote), &quot;quote&quot;));
        }
        if (evidence.supporting_sentence) {
          const fullEvidence = el(&quot;details&quot;, null, &quot;method-details&quot;);
          fullEvidence.append(el(&quot;summary&quot;, &quot;Full supporting sentence&quot;, &quot;cursor-interaction&quot;), el(&quot;blockquote&quot;, text(evidence.supporting_sentence), &quot;quote&quot;));
          if (evidence.english_translation) addLine(fullEvidence, &quot;English translation&quot;, evidence.english_translation);
          content.append(fullEvidence);
        }
        if (evidence.paraphrase &amp;&amp; evidence.paraphrase !== evidence.quote) addLine(content, &quot;Plain meaning&quot;, evidence.paraphrase);
        section.append(summary, content);
        return section;
      }
      function renderMethod() {
        const section = find(&quot;dnipro-event-method&quot;);
        section.append(el(&quot;h3&quot;, &quot;Scope and attribution&quot;));
        if (data.event?.description) section.append(el(&quot;p&quot;, data.event.description, &quot;detail-line&quot;));
        addLine(section, &quot;Supportive connections&quot;, &quot;The arrow points from the claim that supplies a reason to the claim receiving support. It reflects the analyst’s reasoning about the specified part of the claim. Any article response or endorsement would require separate evidence.&quot;);
        addLine(section, &quot;Neutral or unresolved comparisons&quot;, &quot;These comparisons link two claims without assigning a direction of support.&quot;);
        addLine(section, &quot;Contradiction connections&quot;, &quot;A solid red arrow points from the source claim to the target claim it is proposed to contradict. This direction follows the analyst-assigned comparison order. The reason and limits identify the disputed point and any differences in place, time, definitions or scope. Human review is pending.&quot;);
        addLine(section, &quot;Review for all connections&quot;, &quot;AI-assisted proposed claim relations. Human review pending.&quot;);
        if (Array.isArray(data.excluded) &amp;&amp; data.excluded.length) {

ur regions or make CNN the author of the allegation.&quot;,&quot;direction_reason&quot;:&quot;CNN02 reinforces the named part of FT02’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F09&quot;,&quot;source&quot;:&quot;ft&quot;,&quot;target&quot;:&quot;kyivpost&quot;,&quot;source_claim&quot;:&quot;FT04&quot;,&quot;target_claim&quot;:&quot;KI02&quot;,&quot;framing_dimension_id&quot;:&quot;lens_authenticity_of_the_result&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;An individual voter expects to have no meaningful influence supports Announced outcomes will be manufactured&quot;,&quot;source_lens&quot;:&quot;An individual voter expects to have no meaningful influence&quot;,&quot;target_lens&quot;:&quot;Announced outcomes will be manufactured&quot;,&quot;shared_focus&quot;:&quot;Whether the announced results will meaningfully depend on residents’ participation and choices&quot;,&quot;reason&quot;:&quot;The Donetsk businessman’s expectation that a vote will be counted even if he does not participate presents the result as detached from his agency. That account reinforces the manufactured-outcome lens in Jean-Pierre’s statement reported by Kyiv Independent.&quot;,&quot;support_scope&quot;:&quot;The interpretation of outcomes as detached from individual voter agency.&quot;,&quot;caveat&quot;:&quot;An unnamed individual’s expectation in Donetsk is not proof of how votes were counted, and cannot verify Jean-Pierre’s broader prediction about every announced outcome. These are attributed views, not endorsements by both outlets.&quot;,&quot;direction_reason&quot;:&quot;FT04 reinforces the named part of KI02’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F10&quot;,&quot;source&quot;:&quot;izvestia&quot;,&quot;target&quot;:&quot;tass&quot;,&quot;source_claim&quot;:&quot;I08&quot;,&quot;target_claim&quot;:&quot;T03&quot;,&quot;framing_dimension_id&quot;:&quot;lens_procedural_legitimacy&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;Observation is foregrounded as part of the voting process supports Preparation is presented as open and transparent&quot;,&quot;source_lens&quot;:&quot;Observation is foregrounded as part of the voting process&quot;,&quot;target_lens&quot;:&quot;Preparation is presented as open and transparent&quot;,&quot;shared_focus&quot;:&quot;The use of observers to present the votes as an orderly and scrutinized process&quot;,&quot;reason&quot;:&quot;Izvestia’s planned-observer account foregrounds observation of the voting. This supplies one procedural feature consistent with Matviyenko’s openness-and-transparency presentation in TASS.&quot;,&quot;support_scope&quot;:&quot;The observation-related part of the procedural presentation, not the entire transparency assessment.&quot;,&quot;caveat&quot;:&quot;The presence or planned presence of observers does not establish their independence, meaningful access, lawful voting, or freedom from coercion. Similar official information may underlie both passages; this is support for a procedural presentation, not independent corroboration of transparency.&quot;,&quot;direction_reason&quot;:&quot;I08 reinforces the named part of T03’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;},{&quot;id&quot;:&quot;F11&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;global_times&quot;,&quot;source_claim&quot;:&quot;CNN07&quot;,&quot;target_claim&quot;:&quot;GT04&quot;,&quot;framing_dimension_id&quot;:&quot;lens_escalation_stakes&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;label&quot;:&quot;Claimed incorporation would redefine Ukrainian attacks as attacks on Russia supports Claimed incorporation could raise Russia’s response stakes&quot;,&quot;source_lens&quot;:&quot;Claimed incorporation would redefine Ukrainian attacks as attacks on Russia&quot;,&quot;target_lens&quot;:&quot;Claimed incorporation could raise Russia’s response stakes&quot;,&quot;shared_focus&quot;:&quot;How the proposed incorporation could change Russia’s treatment of later Ukrainian attacks&quot;,&quot;reason&quot;:&quot;Peskov’s statement in CNN supplies the territorial reclassification behind the escalation lens: Russia would regard Ukrainian efforts to retake the regions as attacks on Russian territory. That stated position gives a reason for the Global Times expert’s forecast of a wider range of possible Russian responses.&quot;,&quot;support_scope&quot;:&quot;The escalation mechanism in the conditional forecast, rather than every predicted Russian response.&quot;,&quot;caveat&quot;:&quot;Both statements concern a conditional future after claimed incorporation. Peskov’s classification does not establish legal sovereignty, justify a response, or confirm the expert’s prediction that Russia might use every possible military and political means. Neither quotation establishes an outlet endorsement.&quot;,&quot;direction_reason&quot;:&quot;CNN07 reinforces the named part of GT04’s framing. Direction records the analyst’s proposed support relation, not a response between articles.&quot;}],&quot;within_article_relations&quot;:[],&quot;excluded&quot;:[{&quot;outlet&quot;:&quot;European Pravda&quot;,&quot;reason&quot;:&quot;The selected article concerns a war-crimes accountability meeting, not these votes.&quot;},{&quot;outlet&quot;:&quot;China Daily&quot;,&quot;reason&quot;:&quot;The selected article reports general peace and security comments at the UN, without discussing these votes.&quot;},{&quot;outlet&quot;:&quot;Sputnik&quot;,&quot;source&quot;:&quot;sputnik&quot;,&quot;reason&quot;:&quot;No matching framing relation was selected from this article for this network.&quot;}],&quot;method&quot;:{&quot;country_note&quot;:&quot;Outlet country means origin. A source’s country means stated office, institution or residence; citizenship is not guessed. Russia-appointed offices in Ukrainian cities are identified as such.&quot;,&quot;claim_type_note&quot;:&quot;A fact claim is a statement that could be checked, not a fact verified by this graph. Legal interpretations, opinions, promises and framing are separate types.&quot;,&quot;edge_note&quot;:&quot;Green arrows point from a supporting claim to the claim receiving support. Grey comparisons have no assigned direction. Solid red arrows point from a source claim to a target claim it is proposed to contradict. Red direction follows the analyst-assigned comparison order. Every proposed conflict retains its reasoning and scope limits for human review.&quot;,&quot;attention_note&quot;:&quot;Attention is judged from the saved article text and paragraph allocation, not as an outlet-wide bias score.&quot;,&quot;endorsement_note&quot;:&quot;Quoted officials, residents and narrators have separate claim sections. Repeated TASS/Matviyenko statements are marked as shared sources, not independent findings.&quot;,&quot;annotation_status&quot;:&quot;AI-assisted proposed research graph; human review pending.&quot;,&quot;cleaning_note&quot;:&quot;Only paragraph 1 of the Kyiv Independent saved text belongs to this article; later news-feed paragraphs were excluded. Sputnik’s introduction is not treated as if its missing infographic figures were recovered.&quot;},&quot;framing_topics&quot;:[{&quot;framing_dimension_id&quot;:&quot;lens_voter_agency&quot;,&quot;framing_dimension_label&quot;:&quot;Voter agency&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_authenticity_of_the_result&quot;,&quot;framing_dimension_label&quot;:&quot;Authenticity of the result&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_procedural_legitimacy&quot;,&quot;framing_dimension_label&quot;:&quot;Procedural legitimacy&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_escalation_stakes&quot;,&quot;framing_dimension_label&quot;:&quot;Escalation stakes&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_territorial_status&quot;,&quot;framing_dimension_label&quot;:&quot;Territorial status&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_role_of_armed_escorts&quot;,&quot;framing_dimension_label&quot;:&quot;Role of armed escorts&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_who_drives_the_event&quot;,&quot;framing_dimension_label&quot;:&quot;Who drives the event&quot;},{&quot;framing_dimension_id&quot;:&quot;lens_basis_of_the_claimed_mandate&quot;,&quot;framing_dimension_label&quot;:&quot;Basis of the claimed mandate&quot;}]}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;
      const root = document.getElementById(&quot;dnipro-event-graph&quot;);
      if (!root) return;
      const find = (id) =&gt; root.querySelector(&quot;#&quot; + id);
      const detail = find(&quot;dnipro-claim-detail&quot;);
      const detailPane = find(&quot;dnipro-detail-pane&quot;);
      let data;
      try {
        data = JSON.parse(find(&quot;dnipro-claim-data&quot;).textContent);
      } catch (error) {
        const alert = document.createElement(&quot;p&quot;);
        alert.setAttribute(&quot;role&quot;, &quot;alert&quot;);
        alert.textContent = &quot;The article data could not be loaded.&quot;;
        detail.replaceChildren(alert);
        return;
      }
      const nodes = Array.isArray(data.nodes) ? data.nodes : [];
      const topics = Array.isArray(data.topics) ? data.topics : [];
      const framingTopics = Array.isArray(data.framing_topics) ? data.framing_topics : [];
      const edges = Array.isArray(data.edges) ? data.edges : [];
      const nodeById = new Map(nodes.map((node) =&gt; [node.id, node]));
      const edgeById = new Map(edges.map(edge =&gt; [edge.id, edge]));
      const groupsByKey = new Map();
      const groupByEdgeId = new Map();
      activeEdges().forEach(edge =&gt; {
        const pair = [edge.source, edge.target];
        const key = JSON.stringify([edge.relation, ...pair]);
        if (!groupsByKey.has(key)) groupsByKey.set(key, { ...edge, members: [] });
        const group = groupsByKey.get(key);
        group.members.push(edge);
        groupByEdgeId.set(edge.id, group);
      });
      const edgeGroups = [...groupsByKey.values()];
      const topicById = new Map(topics.map((topic) =&gt; [topic.id, topic]));
      const framingTopicById = new Map(framingTopics.map((topic) =&gt; [topic.framing_dimension_id, topic]));
      const claimById = new Map();
      nodes.forEach((node) =&gt; (node.claims || []).forEach((claim) =&gt; claimById.set(claim.id, claim)));
      const stage = find(&quot;dnipro-graph-stage&quot;);
      const svg = find(&quot;dnipro-graph-lines&quot;);
      const nodeLayer = find(&quot;dnipro-graph-nodes&quot;);
      const comparisons = find(&quot;dnipro-comparison-list&quot;);
      const status = find(&quot;dnipro-selection-status&quot;);
      const nodeElements = new Map();
      const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
      const defaultNode = nodeById.has(data.event.default_node) ? data.event.default_node : nodes[0]?.id;
      let state = { selection: { kind: &quot;node&quot;, id: defaultNode } };

      function text(value, fallback = &quot;Not stated&quot;) {
        if (value === null || value === undefined || value === &quot;&quot;) return fallback;
        return typeof value === &quot;string&quot; ? value : String(value);
      }
      function el(tag, content, className) {
        const element = document.createElement(tag);
        if (content !== undefined &amp;&amp; content !== null) element.textContent = content;
        if (className) element.className = className;
        return element;
      }
      function relationName(edge) {
        if (edge.relation === &quot;supportive&quot;) return &quot;Supportive&quot;;
        if (edge.relation === &quot;agreement&quot;) return &quot;Agreement&quot;;
        if (edge.relation === &quot;contradiction&quot;) return &quot;Proposed contradiction&quot;;
        return &quot;Neutral / unresolved&quot;;
      }
      function pairName(edge) {
        return text(nodeById.get(edge.source)?.label, edge.source) + &quot; → &quot; + text(nodeById.get(edge.target)?.label, edge.target);
      }
      function activeEdges() {
        return edges.filter((edge) =&gt; nodeById.has(edge.source) &amp;&amp; nodeById.has(edge.target));
      }
      function readSaved(raw) {
        if (!raw || typeof raw !== &quot;object&quot;) return null;
        const saved = raw.privateContent || raw;
        const candidate = saved.dniproEventGraph || saved.dniproDatedGraph || saved.dniproReferendumGraph;
        if (!candidate || ![1, 2].includes(candidate.version)) return null;
        if (candidate.event_id &amp;&amp; candidate.event_id !== data.event.id) return null;
        return candidate;
      }
      function normalize(candidate) {
        const next = { selection: { ...state.selection } };
        if (candidate?.selection?.kind === &quot;node&quot; &amp;&amp; nodeById.has(candidate.selection.id)) {
          next.selection = { kind: &quot;node&quot;, id: candidate.selection.id };
        } else if (candidate?.selection?.kind === &quot;edge&quot;) {
          const edge = edgeById.get(candidate.selection.id);
          if (edge) next.selection = { kind: &quot;edge&quot;, id: edge.id };
        }
        if (next.selection.kind === &quot;edge&quot;) {
          const edge = edgeById.get(next.selection.id);
          if (!edge) next.selection = { kind: &quot;node&quot;, id: defaultNode };
        }
        return next;
      }
      function saveState() {
        const host = window.openai;
        if (!host || typeof host.setWidgetState !== &quot;function&quot;) return;
        const selection = state.selection;
        const selectedNode = selection.kind === &quot;node&quot; ? nodeById.get(selection.id) : null;
        const selectedEdge = selection.kind === &quot;edge&quot; ? edgeById.get(selection.id) : null;
        const snapshot = {
          modelContent: {
            event: text(data.event?.label),
            date: text(data.event?.date),
            graph_scope: &quot;whole_event&quot;,
            selected_outlet: selectedNode ? text(selectedNode.label) : null,
            selected_comparison: selectedEdge ? { id: selectedEdge.id, outlets: pairName(selectedEdge), relation: selectedEdge.relation, source_claim: selectedEdge.source_claim, target_claim: selectedEdge.target_claim } : null
          },
          privateContent: { dniproEventGraph: { version: 2, event_id: data.event?.id, selection: { ...selection } } }
        };
        try { Promise.resolve(host.setWidgetState(snapshot)).catch(() =&gt; {}); } catch (error) { /* Optional host state must not interrupt reading. */ }
      }
      function selectNode(id) {
        if (!nodeById.has(id)) return;
        state.selection = { kind: &quot;node&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function selectEdge(id) {
        const edge = edgeById.get(id);
        if (!edge) return;
        state.selection = { kind: &quot;edge&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function addLine(parent, label, value) {
        if (value === null || value === undefined || value === &quot;&quot;) return;
        const p = el(&quot;p&quot;, null, &quot;detail-line&quot;);
        p.append(el(&quot;span&quot;, label + &quot;: &quot;, &quot;detail-label&quot;), document.createTextNode(text(value)));
        parent.append(p);
      }
      function articleLink(node) {
        const article = node.article || {};
        let url;
        try { url = new URL(article.url); } catch (error) { return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;); }
        if (![&quot;https:&quot;, &quot;http:&quot;].includes(url.protocol)) return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;);
        const p = el(&quot;p&quot;, null, &quot;detail-link&quot;);
        const link = el(&quot;a&quot;, text(article.title, &quot;Read article&quot;));
        link.href = url.href;
        link.target = &quot;_blank&quot;;
        link.rel = &quot;noopener noreferrer&quot;;
        p.append(link);
        return p;
      }
      function claimSection(claim, node) {
        const section = el(&quot;details&quot;, null, &quot;claim-section&quot;);
        const summary = el(&quot;summary&quot;, claim.id + &quot; · &quot; + (claim.context_only ? &quot;Background · &quot; : &quot;&quot;) + text(claim.text, &quot;Claim&quot;), &quot;cursor-interaction&quot;);
        section.dataset.claimId = claim.id;
        const content = el(&quot;div&quot;, null, &quot;claim-section-content&quot;);
        const fields = el(&quot;dl&quot;, null, &quot;claim-fields&quot;);
        function field(label, value) {
          fields.append(el(&quot;dt&quot;, label));
          const dd = el(&quot;dd&quot;);
          if (value &amp;&amp; value.nodeType) dd.append(value);
          else dd.textContent = text(value);
          fields.append(dd);
        }
        const kind = claim.kind || {};
        field(&quot;Fact or opinion?&quot;, text(kind.label) + (kind.status ? &quot; · &quot; + text(kind.status) : &quot;&quot;));
        const people = el(&quot;ul&quot;);
        const claimants = Array.isArray(claim.claimants) ? claim.claimants : [];
        if (!claimants.length) people.append(el(&quot;li&quot;, &quot;Not stated&quot;));
        claimants.forEach((person) =&gt; {
          const li = el(&quot;li&quot;, text(person.name) + (person.role ? &quot; — &quot; + text(person.role) : &quot;&quot;) + &quot;; &quot; + text(person.country, &quot;Country not stated&quot;));
          if (person.country_basis) li.append(el(&quot;div&quot;, text(person.country_basis), &quot;text-small&quot;));
          people.append(li);
        });
        field(&quot;Who makes the claim?&quot;, people);
        const stance = claim.stance || {};
        const stanceText = el(&quot;div&quot;, text(stance.label) + (stance.target ? &quot; — &quot; + text(stance.target) : &quot;&quot;));
        if (stance.note) stanceText.append(el(&quot;p&quot;, text(stance.note), &quot;detail-line&quot;));
        field(&quot;Supports or criticizes?&quot;, stanceText);
        field(&quot;What gets attention?&quot;, claim.attention || node.attention);
        field(&quot;Outlet’s own view&quot;, claim.outlet_view);
        content.append(fields);
        addLine(content, &quot;Aspect of event&quot;, (claim.topics || []).map(id =&gt; text(topicById.get(id)?.label, id)).join(&quot;; &quot;));
        addLine(content, &quot;Time / place&quot;, claim.where_when);
        addLine(content, &quot;Limits of this claim&quot;, claim.uncertainty);
        const evidence = claim.evidence || {};
        if (evidence.quote) {
          const paragraphNumbers = Array.isArray(evidence.paragraphs) ? evidence.paragraphs : [];
          const label = &quot;Evidence&quot; + (paragraphNumbers.length ? &quot; · paragraph&quot; + (paragraphNumbers.length &gt; 1 ? &quot;s &quot; : &quot; &quot;) + paragraphNumbers.join(&quot;, &quot;) : &quot;&quot;) + (evidence.language ? &quot; · &quot; + evidence.language : &quot;&quot;);
          content.append(el(&quot;p&quot;, label, &quot;detail-label&quot;), el(&quot;blockquote&quot;, text(evidence.quote), &quot;quote&quot;));
        }
        if (evidence.supporting_sentence) {
          const fullEvidence = el(&quot;details&quot;, null, &quot;method-details&quot;);
          fullEvidence.append(el(&quot;summary&quot;, &quot;Full supporting sentence&quot;, &quot;cursor-interaction&quot;), el(&quot;blockquote&quot;, text(evidence.supporting_sentence), &quot;quote&quot;));
          if (evidence.english_translation) addLine(fullEvidence, &quot;English translation&quot;, evidence.english_translation);
          content.append(fullEvidence);
        }
        if (evidence.paraphrase &amp;&amp; evidence.paraphrase !== evidence.quote) addLine(content, &quot;Plain meaning&quot;, evidence.paraphrase);
        section.append(summary, content);
        return section;
      }
      function renderMethod() {
        const section = find(&quot;dnipro-event-method&quot;);
        section.replaceChildren(el(&quot;h3&quot;, &quot;Scope and attribution&quot;));
        addLine(section, &quot;Selected network&quot;, &quot;Framing / lensing network&quot;);
        addLine(section, &quot;What is compared&quot;, &quot;The labels, values, agency and consequences that speakers or narrators foreground in the selected event. Green links reinforce a selected frame; red links mark proposed framing contradictions.&quot;);
        addLine(section, &quot;Selected claims&quot;, &quot;Only the claims used in these framing comparisons appear in this network and its panels.&quot;);
        const selected = state.selection.kind === &quot;edge&quot; ? edgeById.get(state.selection.id) : null;
        const directions = [];
        if (!selected || selected.relation === &quot;supportive&quot;) directions.push(&quot;A green arrow points from a claim that supplies a reason, example or partial support for the target’s framing. It does not mean the articles respond to or endorse each other, verify the claim, or supply independent corroboration. The reverse arrow is not implied.&quot;);
        if (!selected || selected.relation === &quot;contradiction&quot;) directions.push(&quot;A solid red arrow points from the source claim to the target framing it is proposed to contradict. Direction follows the analyst-assigned comparison order; it does not show that one article rebuts the other.&quot;);
        addLine(section, &quot;Direction&quot;, directions.join(&quot; &quot;));
        addLine(section, &quot;Attribution&quot;, &quot;Each passage identifies its speaker or narrator. Several outlets carry more than one lens. The lens labels describe the selected passages, not an outlet-wide position.&quot;);
        addLine(section, &quot;Scope&quot;, &quot;Each comparison retains differences in place, population, criteria and certainty for review. Support may apply only to the named part of a compound claim; shared framing does not establish shared political approval.&quot;);
        addLine(section, &quot;Review&quot;, &quot;AI-assisted proposed framing relations; human review pending.&quot;);
      }
      function renderSelection() {
        renderMethod();
        nodeElements.forEach((wrapper, id) =&gt; wrapper.querySelector(&quot;button&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.selection.kind === &quot;node&quot; &amp;&amp; state.selection.id === id)));
        comparisons.querySelectorAll(&quot;button[data-comparison-id]&quot;).forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(state.selection.kind === &quot;edge&quot; &amp;&amp; state.selection.id === button.dataset.comparisonId)));
        const fragment = document.createDocumentFragment();
        if (state.selection.kind === &quot;edge&quot;) {
          const edge = edgeById.get(state.selection.id);
          if (!edge) return;
          const group = groupByEdgeId.get(edge.id);
          if (!group) return;
          fragment.append(
            el(&quot;h3&quot;, pairName(group)),
            el(&quot;p&quot;, relationName(group) + &quot; · &quot; + group.members.length + (group.members.length === 1 ? &quot; comparison&quot; : &quot; comparisons&quot;))
          );
          group.members.forEach(edge =&gt; {
            const comparison = el(&quot;details&quot;, null, &quot;event-disclosure group-comparison&quot;);
            const claimPair = edge.source_claim + &quot; → &quot; + edge.target_claim;
            const dimensionLabel = framingTopicById.get(edge.framing_dimension_id)?.framing_dimension_label || edge.label;
            comparison.append(el(&quot;summary&quot;, edge.id + &quot; · &quot; + claimPair + &quot; · &quot; + dimensionLabel, &quot;cursor-interaction&quot;));
            addLine(comparison, relationName(edge), edge.label);
            addLine(comparison, &quot;Claims&quot;, edge.source_claim + &quot; → &quot; + edge.target_claim);
            const dimension = framingTopicById.get(edge.framing_dimension_id);
            addLine(comparison, &quot;Framing dimension&quot;, dimension?.framing_dimension_label);
            addLine(comparison, &quot;Shared focus&quot;, edge.shared_focus);
            addLine(comparison, &quot;Source lens&quot;, edge.source_lens);
            addLine(comparison, &quot;Target lens&quot;, edge.target_lens);
            addLine(comparison, &quot;Reason&quot;, edge.reason);
            addLine(comparison, &quot;Does not establish&quot;, edge.unsupported_parts);
            addLine(comparison, &quot;Limit&quot;, edge.caveat);
            [[edge.source, edge.source_claim], [edge.target, edge.target_claim]].forEach(([nodeId, claimId], index) =&gt; {
              const node = nodeById.get(nodeId);
              const claim = claimById.get(claimId);
              if (!node) return;
              comparison.append(el(&quot;hr&quot;), el(&quot;h3&quot;, text(node.label) + &quot; · &quot; + text(node.country)), articleLink(node));
              if (edge.relation === &quot;supportive&quot;) comparison.append(el(&quot;p&quot;, index === 0 ? &quot;Supporting claim&quot; : &quot;Claim receiving support&quot;, &quot;detail-label&quot;));
              if (edge.relation === &quot;contradiction&quot;) comparison.append(el(&quot;p&quot;, index === 0 ? &quot;Contradicting claim&quot; : &quot;Claim being contradicted&quot;, &quot;detail-label&quot;));
              if (claim) comparison.append(claimSection(claim, node));
              else {
                const warning = el(&quot;p&quot;, &quot;The matching claim could not be found.&quot;);
                warning.setAttribute(&quot;role&quot;, &quot;alert&quot;);
                comparison.append(warning);
              }
            });
            fragment.append(comparison);
          });
          status.textContent = &quot;Selected &quot; + pairName(group) + &quot; with &quot; + group.members.length + (group.members.length === 1 ? &quot; comparison.&quot; : &quot; comparisons.&quot;);
        } else {
          const node = nodeById.get(state.selection.id);
          if (!node) return;
          fragment.append(el(&quot;h3&quot;, text(node.label) + &quot; · &quot; + text(node.country)), articleLink(node));
          addLine(fragment, &quot;Lenses in this network&quot;, node.attention);
          const claims = Array.isArray(node.claims) ? node.claims : [];
          claims.forEach(claim =&gt; fragment.append(claimSection(claim, node)));
          status.textContent = &quot;Selected &quot; + text(node.label) + &quot;. All &quot; + claims.length + &quot; article claims and all event connections remain available.&quot;;
        }
        detail.replaceChildren(fragment);
        detailPane.scrollTop = 0;
      }
      function renderComparisonChoices() {
        const current = activeEdges();
        const fragment = document.createDocumentFragment();
        if (!current.length) fragment.append(el(&quot;p&quot;, &quot;No pairwise comparison is established for this event.&quot;, &quot;text-small text-muted&quot;));
        current.forEach((edge) =&gt; {
          const wrapper = el(&quot;div&quot;, null, &quot;comparison-choice&quot;);
          const button = el(&quot;button&quot;, null, &quot;btn btn-block&quot;);

  };
