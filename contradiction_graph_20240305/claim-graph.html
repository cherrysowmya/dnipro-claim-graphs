partial_support&quot;,&quot;reason&quot;:&quot;Kyiv Independent carries HUR’s claim that the vessel was hit and destroyed in the overnight operation. That more specific outcome claim supports the occurrence-of-an-attack component reported by Censor.NET.&quot;,&quot;caveat&quot;:&quot;Both reports rely on Ukrainian military intelligence. The arrow records the implication of the stronger reported claim.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;support_scope&quot;:&quot;The agency’s account of an overnight attack on the ship in CEN01.&quot;,&quot;direction_reason&quot;:&quot;KI01 supplies the specified support for CEN01.&quot;,&quot;unsupported_parts&quot;:&quot;Independent verification of the sinking or every operational detail.&quot;},{&quot;id&quot;:&quot;E05&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;censor&quot;,&quot;topic&quot;:&quot;method&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;CNN03&quot;,&quot;target_claim&quot;:&quot;CEN02&quot;,&quot;label&quot;:&quot;Same reported damage&quot;,&quot;subtype&quot;:&quot;same_original_Ukrainian_account&quot;,&quot;reason&quot;:&quot;Both carry the Ukrainian statement about Magura boats damaging the back and both sides. These reports rely on the same original statement.&quot;,&quot;caveat&quot;:&quot;Same original announcement, not independent inspection of the vessel.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E06&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;china_daily&quot;,&quot;topic&quot;:&quot;method&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;CNN01&quot;,&quot;target_claim&quot;:&quot;CD02&quot;,&quot;label&quot;:&quot;Same reported weapon and location&quot;,&quot;subtype&quot;:&quot;same_original_Ukrainian_account&quot;,&quot;reason&quot;:&quot;Both describe sea drones near the Kerch Strait, attributed to Ukrainian intelligence. These reports rely on the same original statement.&quot;,&quot;caveat&quot;:&quot;Common agency source. Similar technical details do not create independent corroboration.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E07&quot;,&quot;source&quot;:&quot;censor&quot;,&quot;target&quot;:&quot;europeanpravda&quot;,&quot;topic&quot;:&quot;method&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;CEN02&quot;,&quot;target_claim&quot;:&quot;EP03&quot;,&quot;label&quot;:&quot;Same Magura boat account&quot;,&quot;subtype&quot;:&quot;same_original_Ukrainian_account&quot;,&quot;reason&quot;:&quot;Both attribute the use of Magura V5 unmanned boats to Ukrainian intelligence. These reports rely on the same original statement.&quot;,&quot;caveat&quot;:&quot;The source overlap is explicit; the graph does not verify the weapon independently.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E08&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;target&quot;:&quot;europeanpravda&quot;,&quot;topic&quot;:&quot;casualties&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;source_claim&quot;:&quot;KI02&quot;,&quot;target_claim&quot;:&quot;EP04&quot;,&quot;label&quot;:&quot;Later preliminary figures support the broad casualty account&quot;,&quot;subtype&quot;:&quot;specified_partial_support&quot;,&quot;reason&quot;:&quot;Kyiv Independent reports preliminary figures of seven killed and six injured from Ukrainian intelligence. Those figures support the broader claim of several dead and wounded in European Pravda.&quot;,&quot;caveat&quot;:&quot;The accounts come from the same agency at different update times. The later figures remain preliminary.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;support_scope&quot;:&quot;The existence of reported fatalities and injuries in EP04.&quot;,&quot;direction_reason&quot;:&quot;KI02 supplies the specified support for EP04.&quot;,&quot;unsupported_parts&quot;:&quot;A final casualty total or confirmed evacuation numbers.&quot;},{&quot;id&quot;:&quot;E09&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;target&quot;:&quot;china_daily&quot;,&quot;topic&quot;:&quot;reply&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;KI03&quot;,&quot;target_claim&quot;:&quot;CD03&quot;,&quot;label&quot;:&quot;Neither reports a Russian answer&quot;,&quot;subtype&quot;:&quot;parallel_accounts_or_interpretations&quot;,&quot;reason&quot;:&quot;Both articles record no response to the attack at their reporting times. The matching content alone supplies no evidential direction.&quot;,&quot;caveat&quot;:&quot;Kyiv specifies the Defense Ministry; China Daily says Russia more broadly. This is agreement only on the absence of a reported official answer, not a denial of the sinking.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E10&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;target&quot;:&quot;europeanpravda&quot;,&quot;topic&quot;:&quot;impact&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;KI05&quot;,&quot;target_claim&quot;:&quot;EP01&quot;,&quot;label&quot;:&quot;Same Shapps reaction&quot;,&quot;subtype&quot;:&quot;same_official_statement&quot;,&quot;reason&quot;:&quot;Both repeat Shapps’s statement that Russia’s navy is unsafe in the Black Sea. These reports rely on the same original statement.&quot;,&quot;caveat&quot;:&quot;Same social-media statement, not two separate assessments or automatic outlet approval.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E11&quot;,&quot;source&quot;:&quot;cnn&quot;,&quot;target&quot;:&quot;censor&quot;,&quot;topic&quot;:&quot;impact&quot;,&quot;relation&quot;:&quot;neutral&quot;,&quot;source_claim&quot;:&quot;CNN04&quot;,&quot;target_claim&quot;:&quot;CEN03&quot;,&quot;label&quot;:&quot;Same Ukrainian cost estimate&quot;,&quot;subtype&quot;:&quot;same_original_Ukrainian_account&quot;,&quot;reason&quot;:&quot;Both report a value of roughly $65 million attributed to Ukraine. These reports rely on the same original statement.&quot;,&quot;caveat&quot;:&quot;The shared estimate is not an independent market valuation.&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;directed&quot;:false,&quot;direction&quot;:&quot;undirected&quot;},{&quot;id&quot;:&quot;E12&quot;,&quot;source&quot;:&quot;kyivpost&quot;,&quot;target&quot;:&quot;europeanpravda&quot;,&quot;topic&quot;:&quot;impact&quot;,&quot;source_claim&quot;:&quot;KI01&quot;,&quot;target_claim&quot;:&quot;EP01&quot;,&quot;review_status&quot;:&quot;AI-assisted proposed comparison; human review pending&quot;,&quot;relation&quot;:&quot;supportive&quot;,&quot;directed&quot;:true,&quot;direction&quot;:&quot;source_to_target&quot;,&quot;label&quot;:&quot;The reported ship loss supplies a reason for the risk assessment&quot;,&quot;subtype&quot;:&quot;specified_partial_support&quot;,&quot;reason&quot;:&quot;The reported destruction of Sergei Kotov is a concrete incident that supplies a reason for Shapps’s assessment that Russian naval ships face danger in the Black Sea.&quot;,&quot;support_scope&quot;:&quot;The ship-vulnerability assessment quoted in EP01.&quot;,&quot;caveat&quot;:&quot;The rationale depends on accepting the Ukrainian agency’s reported account of the attack. The source overlap remains visible.&quot;,&quot;direction_reason&quot;:&quot;KI01 supplies the specified support for EP01.&quot;,&quot;unsupported_parts&quot;:&quot;A verified sinking, risk to every Russian vessel or conditions everywhere in the Black Sea.&quot;}],&quot;excluded&quot;:[{&quot;source&quot;:&quot;ft&quot;,&quot;outlet&quot;:&quot;Financial Times&quot;,&quot;reason&quot;:&quot;Commentary on Russia’s influence over five post-Soviet neighbors; no Sergei Kotov attack.&quot;},{&quot;source&quot;:&quot;tass&quot;,&quot;outlet&quot;:&quot;TASS&quot;,&quot;reason&quot;:&quot;German investigation of the Taurus-call leak; not the ship sinking.&quot;},{&quot;source&quot;:&quot;sputnik&quot;,&quot;outlet&quot;:&quot;Sputnik&quot;,&quot;reason&quot;:&quot;Radio-show outline about the German leak and other topics; it does not discuss this ship.&quot;},{&quot;source&quot;:&quot;izvestia&quot;,&quot;outlet&quot;:&quot;Izvestia&quot;,&quot;reason&quot;:&quot;Pistorius’s explanation of the German military-call leak; no Sergei Kotov attack.&quot;},{&quot;source&quot;:&quot;global_times&quot;,&quot;outlet&quot;:&quot;Global Times&quot;,&quot;reason&quot;:&quot;German military-call leak and possible escalation; no report of this ship attack.&quot;}],&quot;method&quot;:{&quot;country_note&quot;:&quot;Outlet countries describe origin. Claimant countries describe an office, organization or stated residence, not assumed citizenship.&quot;,&quot;claim_type_note&quot;:&quot;A fact claim is a checkable statement, not a fact verified by this graph. Opinions, predictions, legal positions and promises are marked separately.&quot;,&quot;edge_note&quot;:&quot;Green arrows point from a supporting claim to the claim receiving support. Grey comparisons have no assigned direction. Solid red arrows point from a source claim to a target claim it is proposed to contradict. Red direction follows the analyst-assigned comparison order. Every proposed conflict retains its reasoning and scope limits for human review.&quot;,&quot;attention_note&quot;:&quot;Attention is a qualitative reading of the saved article, with paragraph locators; it is not a measured share of words.&quot;,&quot;endorsement_note&quot;:&quot;A quoted speaker’s view is separate from the article narrator’s view. No outlet-wide position is inferred from one article.&quot;,&quot;annotation_status&quot;:&quot;AI-assisted draft; human review pending&quot;,&quot;cleaning_note&quot;:&quot;Uses saved recovered text. Kyiv Independent later Most Popular / News Feed material is excluded; original paragraph numbers retained. FT wrapped lines are joined into logical paragraphs.&quot;}}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;
      const root = document.getElementById(&quot;dnipro-event-graph&quot;);
      if (!root) return;
      const find = (id) =&gt; root.querySelector(&quot;#&quot; + id);
      const detail = find(&quot;dnipro-claim-detail&quot;);
      const detailPane = find(&quot;dnipro-detail-pane&quot;);
      let data;
      try {
        data = JSON.parse(find(&quot;dnipro-claim-data&quot;).textContent);
      } catch (error) {
        const alert = document.createElement(&quot;p&quot;);
        alert.setAttribute(&quot;role&quot;, &quot;alert&quot;);
        alert.textContent = &quot;The article data could not be loaded.&quot;;
        detail.replaceChildren(alert);
        return;
      }
      const nodes = Array.isArray(data.nodes) ? data.nodes : [];
      const topics = Array.isArray(data.topics) ? data.topics : [];
      const edges = Array.isArray(data.edges) ? data.edges : [];
      const nodeById = new Map(nodes.map((node) =&gt; [node.id, node]));
      const edgeById = new Map(edges.map(edge =&gt; [edge.id, edge]));
      const groupsByKey = new Map();
      const groupByEdgeId = new Map();
      activeEdges().forEach(edge =&gt; {
        const pair = [edge.source, edge.target];
        if (!edge.directed) pair.sort();
        const key = JSON.stringify([edge.relation, Boolean(edge.directed), ...pair]);
        if (!groupsByKey.has(key)) groupsByKey.set(key, { ...edge, members: [] });
        const group = groupsByKey.get(key);
        group.members.push(edge);
        groupByEdgeId.set(edge.id, group);
      });
      const edgeGroups = [...groupsByKey.values()];
      const topicById = new Map(topics.map((topic) =&gt; [topic.id, topic]));
      const claimById = new Map();
      nodes.forEach((node) =&gt; (node.claims || []).forEach((claim) =&gt; claimById.set(claim.id, claim)));
      const stage = find(&quot;dnipro-graph-stage&quot;);
      const svg = find(&quot;dnipro-graph-lines&quot;);
      const nodeLayer = find(&quot;dnipro-graph-nodes&quot;);
      const comparisons = find(&quot;dnipro-comparison-list&quot;);
      const status = find(&quot;dnipro-selection-status&quot;);
      const nodeElements = new Map();
      const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
      const defaultNode = nodeById.has(data.event.default_node) ? data.event.default_node : nodes[0]?.id;
      let state = { selection: { kind: &quot;node&quot;, id: defaultNode } };

      function text(value, fallback = &quot;Not stated&quot;) {
        if (value === null || value === undefined || value === &quot;&quot;) return fallback;
        return typeof value === &quot;string&quot; ? value : String(value);
      }
      function el(tag, content, className) {
        const element = document.createElement(tag);
        if (content !== undefined &amp;&amp; content !== null) element.textContent = content;
        if (className) element.className = className;
        return element;
      }
      function relationName(edge) {
        if (edge.relation === &quot;supportive&quot;) return &quot;Supportive&quot;;
        if (edge.relation === &quot;contradiction&quot;) return &quot;Proposed contradiction&quot;;
        return &quot;Neutral / unresolved&quot;;
      }
      function pairName(edge) {
        return text(nodeById.get(edge.source)?.label, edge.source) + (edge.directed ? &quot; → &quot; : &quot; ↔ &quot;) + text(nodeById.get(edge.target)?.label, edge.target);
      }
      function activeEdges() {
        return edges.filter((edge) =&gt; nodeById.has(edge.source) &amp;&amp; nodeById.has(edge.target));
      }
      function readSaved(raw) {
        if (!raw || typeof raw !== &quot;object&quot;) return null;
        const saved = raw.privateContent || raw;
        const candidate = saved.dniproEventGraph || saved.dniproDatedGraph || saved.dniproReferendumGraph;
        if (!candidate || ![1, 2].includes(candidate.version)) return null;
        if (candidate.event_id &amp;&amp; candidate.event_id !== data.event.id) return null;
        return candidate;
      }
      function normalize(candidate) {
        const next = { selection: { ...state.selection } };
        if (candidate?.selection?.kind === &quot;node&quot; &amp;&amp; nodeById.has(candidate.selection.id)) {
          next.selection = { kind: &quot;node&quot;, id: candidate.selection.id };
        } else if (candidate?.selection?.kind === &quot;edge&quot;) {
          const edge = edgeById.get(candidate.selection.id);
          if (edge) next.selection = { kind: &quot;edge&quot;, id: edge.id };
        }
        if (next.selection.kind === &quot;edge&quot;) {
          const edge = edgeById.get(next.selection.id);
          if (!edge) next.selection = { kind: &quot;node&quot;, id: defaultNode };
        }
        return next;
      }
      function saveState() {
        const host = window.openai;
        if (!host || typeof host.setWidgetState !== &quot;function&quot;) return;
        const selection = state.selection;
        const selectedNode = selection.kind === &quot;node&quot; ? nodeById.get(selection.id) : null;
        const selectedEdge = selection.kind === &quot;edge&quot; ? edgeById.get(selection.id) : null;
        const snapshot = {
          modelContent: {
            event: text(data.event?.label),
            date: text(data.event?.date),
            graph_scope: &quot;whole_event&quot;,
            selected_outlet: selectedNode ? text(selectedNode.label) : null,
            selected_comparison: selectedEdge ? { id: selectedEdge.id, outlets: pairName(selectedEdge), relation: selectedEdge.relation, source_claim: selectedEdge.source_claim, target_claim: selectedEdge.target_claim } : null
          },
          privateContent: { dniproEventGraph: { version: 2, event_id: data.event?.id, selection: { ...selection } } }
        };
        try { Promise.resolve(host.setWidgetState(snapshot)).catch(() =&gt; {}); } catch (error) { /* Optional host state must not interrupt reading. */ }
      }
      function selectNode(id) {
        if (!nodeById.has(id)) return;
        state.selection = { kind: &quot;node&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function selectEdge(id) {
        const edge = edgeById.get(id);
        if (!edge) return;
        state.selection = { kind: &quot;edge&quot;, id };
        renderSelection();
        drawGraph();
        saveState();
      }
      function addLine(parent, label, value) {
        if (value === null || value === undefined || value === &quot;&quot;) return;
        const p = el(&quot;p&quot;, null, &quot;detail-line&quot;);
        p.append(el(&quot;span&quot;, label + &quot;: &quot;, &quot;detail-label&quot;), document.createTextNode(text(value)));
        parent.append(p);
      }
      function articleLink(node) {
        const article = node.article || {};
        let url;
        try { url = new URL(article.url); } catch (error) { return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;); }
        if (![&quot;https:&quot;, &quot;http:&quot;].includes(url.protocol)) return el(&quot;p&quot;, text(article.title), &quot;detail-link&quot;);
        const p = el(&quot;p&quot;, null, &quot;detail-link&quot;);
        const link = el(&quot;a&quot;, text(article.title, &quot;Read article&quot;));
        link.href = url.href;
        link.target = &quot;_blank&quot;;
        link.rel = &quot;noopener noreferrer&quot;;
        p.append(link);
        return p;
      }
      function claimSection(claim, node) {
        const section = el(&quot;details&quot;, null, &quot;claim-section&quot;);
        const summary = el(&quot;summary&quot;, claim.id + &quot; · &quot; + (claim.context_only ? &quot;Background · &quot; : &quot;&quot;) + text(claim.text, &quot;Claim&quot;), &quot;cursor-interaction&quot;);
        section.dataset.claimId = claim.id;
        const content = el(&quot;div&quot;, null, &quot;claim-section-content&quot;);
        const fields = el(&quot;dl&quot;, null, &quot;claim-fields&quot;);
        function field(label, value) {
          fields.append(el(&quot;dt&quot;, label));
          const dd = el(&quot;dd&quot;);
          if (value &amp;&amp; value.nodeType) dd.append(value);
          else dd.textContent = text(value);
          fields.append(dd);
        }
        const kind = claim.kind || {};
        field(&quot;Fact or opinion?&quot;, text(kind.label) + (kind.status ? &quot; · &quot; + text(kind.status) : &quot;&quot;));
        const people = el(&quot;ul&quot;);
        const claimants = Array.isArray(claim.claimants) ? claim.claimants : [];
        if (!claimants.length) people.append(el(&quot;li&quot;, &quot;Not stated&quot;));
        claimants.forEach((person) =&gt; {
          const li = el(&quot;li&quot;, text(person.name) + (person.role ? &quot; — &quot; + text(person.role) : &quot;&quot;) + &quot;; &quot; + text(person.country, &quot;Country not stated&quot;));
          if (person.country_basis) li.append(el(&quot;div&quot;, text(person.country_basis), &quot;text-small&quot;));
          people.append(li);
        });
        field(&quot;Who makes the claim?&quot;, people);
        const stance = claim.stance || {};
        const stanceText = el(&quot;div&quot;, text(stance.label) + (stance.target ? &quot; — &quot; + text(stance.target) : &quot;&quot;));
        if (stance.note) stanceText.append(el(&quot;p&quot;, text(stance.note), &quot;detail-line&quot;));
        field(&quot;Supports or criticizes?&quot;, stanceText);
        field(&quot;What gets attention?&quot;, claim.attention || node.attention);
        field(&quot;Outlet’s own view&quot;, claim.outlet_view);
        content.append(fields);
        addLine(content, &quot;Aspect of event&quot;, (claim.topics || []).map(id =&gt; text(topicById.get(id)?.label, id)).join(&quot;; &quot;));
        addLine(content, &quot;Time / place&quot;, claim.where_when);
        addLine(content, &quot;Limits of this claim&quot;, claim.uncertainty);
        const evidence = claim.evidence || {};
        if (evidence.quote) {
          const paragraphNumbers = Array.isArray(evidence.paragraphs) ? evidence.paragraphs : [];
          const label = &quot;Evidence&quot; + (paragraphNumbers.length ? &quot; · paragraph&quot; + (paragraphNumbers.length &gt; 1 ? &quot;s &quot; : &quot; &quot;) + paragraphNumbers.join(&quot;, &quot;) : &quot;&quot;) + (evidence.language ? &quot; · &quot; + evidence.language : &quot;&quot;);
          content.append(el(&quot;p&quot;, label, &quot;detail-label&quot;), el(&quot;blockquote&quot;, text(evidence.quote), &quot;quote&quot;));
        }
        if (evidence.supporting_sentence) {
          const fullEvidence = el(&quot;details&quot;, null, &quot;method-details&quot;);
          fullEvidence.append(el(&quot;summary&quot;, &quot;Full supporting sentence&quot;, &quot;cursor-interaction&quot;), el(&quot;blockquote&quot;, text(evidence.supporting_sentence), &quot;quote&quot;));
          if (evidence.english_translation) addLine(fullEvidence, &quot;English translation&quot;, evidence.english_translation);
          content.append(fullEvidence);
        }
        if (evidence.paraphrase &amp;&amp; evidence.paraphrase !== evidence.quote) addLine(content, &quot;Plain meaning&quot;, evidence.paraphrase);
        section.append(summary, content);
        return section;
      }
      function renderMethod() {

  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
